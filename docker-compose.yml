services:
  db:
    image: postgres:15
    container_name: meridian-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meridian
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - meridian-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production-style container (the image Azure Container Apps will run).
  # Behind a profile so plain `docker compose up -d` still starts only the DB
  # for local dev. Full stack: docker compose --profile app up -d --build
  app:
    build: ./web
    container_name: meridian-app
    profiles: ["app"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meridian
    depends_on:
      db:
        condition: service_healthy

volumes:
  meridian-pgdata:
