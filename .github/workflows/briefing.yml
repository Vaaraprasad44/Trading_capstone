# Daily AI market briefing — runs scripts/generate-briefing.ts and commits the
# JSON. The app reads web/data/briefing/latest.json from raw.githubusercontent
# at request time, so no redeploy is needed (and this bot commit wouldn't
# trigger deploy.yml anyway — pushes made with GITHUB_TOKEN don't start other
# workflows).
#
# Requires one repo SECRET: ANTHROPIC_API_KEY.
name: briefing
on:
  schedule:
    # 7:30 AM Central during daylight saving (12:30 UTC); drifts to 6:30 AM
    # Central when DST ends — fine for a premarket briefing.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Generate briefing
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-briefing.ts

      - name: Commit briefing data
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add web/data/briefing
          git diff --cached --quiet || git commit -m "Update AI market briefing"
          git push
