<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Capital — Multi-Fund Dashboard (Mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f4f5f9; --surface:#fff; --surface-2:#f7f8fc; --border:#e7e9f0;
    --text:#1a1d2b; --text-2:#5b6071; --text-3:#9095a6;
    --brand:#4e4feb; --brand-soft:#ececfe;
    --up:#189e6a; --up-soft:#e4f6ee; --dn:#e0413a; --dn-soft:#fdeceb; --amber:#e8911c;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 3px rgba(20,23,40,.04),0 8px 24px rgba(20,23,40,.04);
  }
  [data-theme="dark"]{
    --bg:#0d0f17; --surface:#161925; --surface-2:#1c2030; --border:#262a3a;
    --text:#eef0f6; --text-2:#a3a8bb; --text-3:#6b7081;
    --brand:#7c7cff; --brand-soft:#23234a;
    --up:#34d399; --up-soft:#123026; --dn:#f87171; --dn-soft:#3a1d1d;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}

  .nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .logo-mark{width:32px;height:32px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
  .nav-right{display:flex;align-items:center;gap:14px}
  .fund-switch{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
  .fund-switch button{border:none;background:transparent;color:var(--text-2);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .fund-switch button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;color:var(--text-2)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}

  .hero{padding:28px 0 8px}
  .hero h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
  .hero h1 .accent{color:var(--brand)}
  .hero p{color:var(--text-2);font-size:14px;margin-top:6px}
  .strat-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin-top:10px;letter-spacing:.03em;text-transform:uppercase}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section{margin-top:20px}
  .card-pad{padding:18px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .section-head h2{font-size:16px;font-weight:600}
  .muted{color:var(--text-3);font-size:12px;font-weight:500}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px;font-weight:500}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,158,106,.4)}70%{box-shadow:0 0 0 6px rgba(24,158,106,0)}100%{box-shadow:0 0 0 0 rgba(24,158,106,0)}}

  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:18px}
  .kpi{text-align:left}
  .kpi+.kpi{border-left:1px solid var(--border);padding-left:18px}
  .kpi .label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase}
  .kpi .value{font-size:23px;font-weight:700;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-top:7px;font-variant-numeric:tabular-nums}
  .pill.up{background:var(--up-soft);color:var(--up)} .pill.dn{background:var(--dn-soft);color:var(--dn)}
  .t-up{color:var(--up)} .t-dn{color:var(--dn)}

  .ai-strip{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-top:20px;background:linear-gradient(90deg,var(--brand-soft),var(--surface));border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
  .ai-ico{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .ai-body{flex:1}
  .ai-body .tag{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-transform:uppercase}
  .ai-body .msg{font-size:14px;color:var(--text);margin-top:2px}
  .ai-cta{color:var(--brand);font-size:13px;font-weight:600;white-space:nowrap}

  .cash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:18px}
  .cash-cell{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px 16px}
  .cash-cell .label{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
  .cash-cell .value{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .cash-cell .note{font-size:11px;color:var(--text-3);margin-top:4px;font-style:italic}
  .split-bar{height:22px;border-radius:7px;overflow:hidden;display:flex;margin:0 18px 14px}
  .split-bar .sd{background:var(--up)} .split-bar .sc{background:var(--brand)}
  .split-legend{display:flex;gap:18px;padding:0 18px 16px;font-size:12px;color:var(--text-2)}
  .split-legend span{display:inline-flex;align-items:center;gap:6px}
  .sq{width:10px;height:10px;border-radius:3px}

  .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}
  .cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  .seg-ctrl{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
  .seg-ctrl button{border:none;background:transparent;color:var(--text-2);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer}
  .seg-ctrl button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

  .alloc-wrap{display:flex;align-items:center;gap:20px}
  .alloc-legend{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .alloc-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
  .alloc-row .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .alloc-row .pct{margin-left:auto;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}

  .act{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
  .act:last-child{border-bottom:none}
  .act-logo{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0}
  .act-main{flex:1;font-size:13px;color:var(--text)} .act-main b{font-weight:600}
  .act-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px}
  .act-tag.buy{background:var(--up-soft);color:var(--up)} .act-tag.sell{background:var(--dn-soft);color:var(--dn)}
  .act-date{font-size:11px;color:var(--text-3);margin-top:3px}

  .ai-hint{display:flex;align-items:center;gap:9px;margin:0 18px 6px;padding:10px 13px;background:var(--brand-soft);border-radius:var(--radius-sm);font-size:12.5px;color:var(--brand);font-weight:500;cursor:default}
  .ai-hint .ai-hint-ico{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .ai-hint b{font-weight:700}
  .table-tools{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;width:280px}
  .search input{border:none;background:transparent;outline:none;font:inherit;font-size:13px;color:var(--text);width:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;text-align:right;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th .arrow{opacity:.4;font-size:9px}
  thead th.sorted .arrow{opacity:1;color:var(--brand)}
  tbody td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  tbody td:first-child{font-weight:700;text-align:left}
  tbody td:nth-child(2){text-align:left;color:var(--text-2)}
  .tkr{display:inline-flex;align-items:center;gap:8px}
  .tkr .chev{color:var(--text-3);font-size:11px}
  .flash-up{animation:fu .6s} .flash-dn{animation:fd .6s}
  @keyframes fu{0%{background:var(--up-soft)}100%{background:transparent}}
  @keyframes fd{0%{background:var(--dn-soft)}100%{background:transparent}}

  /* gauge */
  .gauge-wrap{display:flex;align-items:center;gap:16px}
  .gauge{position:relative;width:120px;height:120px;flex-shrink:0}
  .gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .num b{font-size:24px;font-weight:700}
  .gauge .num small{font-size:11px;color:var(--text-3)}

  /* ask */
  .ask-row{display:flex;gap:10px}
  .ask-row input{flex:1;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;color:var(--text);outline:none}
  .ask-row input:focus{border-color:var(--brand)}
  .ask-btn{border:none;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:14px;padding:0 20px;border-radius:10px;cursor:pointer}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:7px 13px;border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--brand);color:var(--brand)}

  /* drill-down drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);opacity:0;visibility:hidden;transition:opacity .25s;z-index:90}
  .scrim.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;right:0;height:100%;width:560px;max-width:94vw;background:var(--bg);box-shadow:-8px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;overflow-y:auto}
  .drawer.open{transform:translateX(0)}
  .dd-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:18px 22px;display:flex;align-items:flex-start;justify-content:space-between;z-index:2}
  .dd-tkr{font-size:20px;font-weight:700}
  .dd-name{font-size:13px;color:var(--text-2)}
  .dd-price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .dd-body{padding:22px}
  .dd-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
  .dd-card h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .ai-badge{font-size:10px;font-weight:700;color:#fff;background:var(--brand);padding:2px 8px;border-radius:6px;letter-spacing:.03em}
  .fact{display:flex;gap:10px;font-size:13px;color:var(--text);margin-bottom:9px;line-height:1.5}
  .fact:last-child{margin-bottom:0}
  .fact .b{color:var(--brand);flex-shrink:0;font-weight:700}
  .fund-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .fund-item{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid var(--border);padding-bottom:8px}
  .fund-item .k{color:var(--text-2)} .fund-item .v{font-weight:600;font-variant-numeric:tabular-nums}
  .news{display:flex;flex-direction:column;gap:12px}
  .news-item{display:flex;gap:10px}
  .rel{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;height:fit-content;white-space:nowrap}
  .rel.high{background:var(--dn-soft);color:var(--dn)} .rel.med{background:var(--up-soft);color:var(--up)} .rel.low{background:var(--surface-2);color:var(--text-3)}
  .news-item .h{font-size:13px;color:var(--text);line-height:1.4}
  .news-item .s{font-size:11px;color:var(--text-3);margin-top:2px}

  .foot{text-align:center;color:var(--text-3);font-size:12px;margin-top:28px}

  @media (max-width:900px){
    .kpi-grid{grid-template-columns:repeat(2,1fr)} .kpi+.kpi{border-left:none;padding-left:0}
    .cash-grid{grid-template-columns:repeat(2,1fr)} .cols,.cols-3{grid-template-columns:1fr}
    .alloc-legend{grid-template-columns:1fr}
  }
</style>
</head>

/* ============ HELPERS ============ */
function usd(n){return '$'+Math.round(n).toLocaleString()}
function usd2(n){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(n){return (n>=0?'+':'')+Number(n).toFixed(2)+'%'}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function el(id){return document.getElementById(id)}

var charts={};
function destroyCharts(){Object.keys(charts).forEach(function(k){if(charts[k]){charts[k].destroy();delete charts[k]}})}
function series(points,start,vol,drift){var a=[],v=start;for(var i=0;i<points;i++){v=v*(1+Math.sin(i*1.3)*vol+drift);a.push(Math.round(v))}return a}

/* ============ SHARED: holdings table ============ */
function holdingsTable(holdings,opts){
  opts=opts||{};
  compute(holdings);
  var rows=holdings.slice();
  if(sortState.filter){rows=rows.filter(function(h){return (h.ticker+' '+h.name).toLowerCase().indexOf(sortState.filter)>-1})}
  rows.sort(function(a,b){var x=a[sortState.key],y=b[sortState.key];if(typeof x==='string'){return x<y?-sortState.dir:x>y?sortState.dir:0}return (x-y)*sortState.dir});
  var body=rows.map(function(h){
    return '<tr onclick="openStock(\''+h.ticker+'\')">'
      +'<td><span class="tkr">'+h.ticker+' <span class="chev">&rsaquo;</span></span></td>'
      +'<td>'+h.name+'</td>'
      +'<td>'+h.qty.toFixed(2)+'</td>'
      +'<td>'+usd2(h.avg)+'</td>'
      +'<td data-px="'+h.ticker+'">'+usd2(h.ltp)+'</td>'
      +'<td>'+usd(h.buyValue)+'</td>'
      +'<td>'+usd(h.presentValue)+'</td>'
      +'<td class="'+(h.pnlPct>=0?'t-up':'t-dn')+'">'+pct(h.pnlPct)+'</td>'
      +'<td>'+h.allocation.toFixed(2)+'%</td>'
      +'<td class="'+(h.day>=0?'t-up':'t-dn')+'">'+pct(h.day)+'</td>'
      +'</tr>';
  }).join('');
  function th(key,label){return '<th data-key="'+key+'" class="'+(sortState.key===key?'sorted':'')+'">'+label+' <span class="arrow">'+(sortState.key===key?(sortState.dir===1?'&#9650;':'&#9660;'):'&#9650;')+'</span></th>'}
  return '<div class="card section"><div class="table-tools"><h2 style="font-size:16px;font-weight:600">'+(opts.title||'Stock holdings')+'</h2>'
    +'<div class="live"><span class="live-dot"></span> Live &middot; updated <span id="ago">2s</span> ago</div></div>'
    +'<div class="table-tools" style="padding-top:0"><div class="search">&#128269; <input type="text" id="searchInput" placeholder="Search holdings…" value="'+sortState.filter+'"/></div></div>'
    +aiHint()
    +'<div style="overflow-x:auto"><table id="holdTable"><thead><tr>'
    +th('ticker','Ticker')+th('name','Name')+th('qty','Qty')+th('avg','Avg buy')+th('ltp','LTP')+th('buyValue','Buy value')+th('presentValue','Present value')+th('pnlPct','P&L %')+th('allocation','Alloc %')+th('day','Day %')
    +'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function compute(holdings){
  var tp=0;holdings.forEach(function(h){h.buyValue=h.qty*h.avg;h.presentValue=h.qty*h.ltp;tp+=h.presentValue});
  holdings.forEach(function(h){h.pnl=h.presentValue-h.buyValue;h.pnlPct=(h.ltp/h.avg-1)*100;h.allocation=h.presentValue/tp*100});
  return tp;
}
function wireTable(holdings){
  var tbl=el('holdTable'); if(!tbl) return;
  tbl.querySelectorAll('thead th').forEach(function(t){t.addEventListener('click',function(e){e.stopPropagation();var k=t.dataset.key;if(sortState.key===k){sortState.dir=-sortState.dir}else{sortState.key=k;sortState.dir=(k==='ticker'||k==='name')?1:-1}renderFund()})});
  var si=el('searchInput'); if(si){si.addEventListener('input',function(e){sortState.filter=e.target.value.toLowerCase().trim();var pos=e.target.selectionStart;renderFund();var n=el('searchInput');if(n){n.focus();n.setSelectionRange(pos,pos)}})}
}

function renderSwing(){

  var wins=closed.filter(function(t){return t.pnl>0});

  var grossL=Math.abs(closed.filter(function(t){return t.pnl<0}).reduce(function(s,t){return s+t.pnl},0));

  wireAsk();
}

/* ============ small builders ============ */
function kpi(label,value,pillTxt,up){
  var v='<div class="kpi"><div class="label">'+label+'</div><div class="value'+(up===true?' t-up':up===false?' t-dn':'')+'">'+value+'</div>';
  if(pillTxt){v+='<span class="pill '+(up?'up':'dn')+'">'+pillTxt+'</span>'}
  return v+'</div>';
}
function cashCell(label,value,note,cls){return '<div class="cash-cell"><div class="label">'+label+'</div><div class="value '+(cls||'')+'">'+value+'</div><div class="note">'+note+'</div></div>'}
function aiStrip(tag,msg){return '<div class="ai-strip" onclick="ask(\'Give me a full AI analysis of the '+currentFund+' fund.\')"><div class="ai-ico">&#9889;</div><div class="ai-body"><div class="tag">'+tag+'</div><div class="msg">'+msg+'</div></div><div class="ai-cta">Full analysis &rarr;</div></div>'}
function aiHint(){return '<div class="ai-hint"><span class="ai-hint-ico">&#9889;</span><span><b>Click any row</b> to open AI-powered insights — fundamentals, AI-ranked news &amp; key facts for that stock.</span></div>'}
function activityHtml(){return activity.map(function(a){return '<div class="act"><div class="act-logo" style="background:'+a.color+'">'+a.logo.slice(0,4)+'</div><div class="act-main"><span class="act-tag '+a.type+'">'+a.type.toUpperCase()+'</span>'+a.text+'<div class="act-date">'+a.date+'</div></div></div>'}).join('')}
function askBox(){return '<div class="card card-pad"><div class="section-head"><h2>Ask the portfolio</h2><span class="muted">AI-powered</span></div><div class="ask-row"><input type="text" id="askInput" placeholder="e.g. Which holdings are beating the S&P 500?"/><button class="ask-btn" onclick="askFromInput()">Ask</button></div><div class="chips"><span class="chip" onclick="ask(\'Am I too concentrated in any single stock?\')">Concentration risk?</span><span class="chip" onclick="ask(\'Which holdings are beating the market?\')">Beating the market?</span><span class="chip" onclick="ask(\'Summarize this month\\\'s activity.\')">Summarize this month</span></div></div>'}

/* ============ DRILL-DOWN ============ */
function findHolding(t){
  return alphaHoldings.concat(sipHoldings,swingOpen).filter(function(h){return h.ticker===t})[0];
}
function openStock(t){
  var info=infoFor(t);
  var h=findHolding(t);
  var price = h?h.ltp:(STOCK_INFO[t]?parseFloat(STOCK_INFO[t].hi):100);
  var day = h?h.day:0;
  el('ddTkr').textContent=t;
  el('ddName').textContent=(h?h.name:t)+' · '+info.sector;
  el('ddPrice').textContent=usd2(price);
  var chg=el('ddChg'); chg.textContent=pct(day); chg.className=day>=0?'t-up':'t-dn';

  var posCard = h ? '<div class="dd-card"><h3>Your position</h3><div class="fund-grid">'
    +'<div class="fund-item"><span class="k">Quantity</span><span class="v">'+h.qty.toFixed(2)+'</span></div>'
    +'<div class="fund-item"><span class="k">Avg buy</span><span class="v">'+usd2(h.avg)+'</span></div>'
    +'<div class="fund-item"><span class="k">Present value</span><span class="v">'+usd(h.qty*h.ltp)+'</span></div>'
    +'<div class="fund-item"><span class="k">P&L</span><span class="v '+((h.ltp-h.avg)>=0?'t-up':'t-dn')+'">'+pct((h.ltp/h.avg-1)*100)+'</span></div>'
    +'</div></div>' : '';

  var html=''
  +'<div class="dd-card"><h3><span class="ai-badge">Key facts ✨</span> AI summary</h3>'
    +info.facts.map(function(f){return '<div class="fact"><span class="b">›</span><span>'+f+'</span></div>'}).join('')
  +'</div>'
  +'<div class="dd-card"><h3>Price · last 30 sessions</h3><div style="position:relative;height:120px"><canvas id="ddSpark"></canvas></div></div>'
  +'<div class="dd-card"><h3>Fundamentals <span class="muted" style="font-weight:400">via market-data MCP</span></h3><div class="fund-grid">'
    +'<div class="fund-item"><span class="k">Market cap</span><span class="v">'+info.mcap+'</span></div>'
    +'<div class="fund-item"><span class="k">P/E (TTM)</span><span class="v">'+info.pe+'</span></div>'
    +'<div class="fund-item"><span class="k">EPS</span><span class="v">'+info.eps+'</span></div>'
    +'<div class="fund-item"><span class="k">Div yield</span><span class="v">'+info.div+'</span></div>'
    +'<div class="fund-item"><span class="k">52w high</span><span class="v">'+info.hi+'</span></div>'
    +'<div class="fund-item"><span class="k">52w low</span><span class="v">'+info.lo+'</span></div>'
  +'</div></div>'
  +posCard
  +'<div class="dd-card"><h3><span class="ai-badge">Today\'s highlights ✨</span> AI-ranked news</h3><div class="news">'
    +info.news.map(function(n){return '<div class="news-item"><span class="rel '+n.r+'">'+(n.r==='high'?'HIGH':n.r==='med'?'MED':'LOW')+'</span><div><div class="h">'+n.h+'</div><div class="s">'+n.s+'</div></div></div>'}).join('')
  +'</div></div>'
  +'<button class="ask-btn" style="width:100%;padding:13px" onclick="ask(\'Tell me more about '+t+' — should I be worried about my position?\')">Ask AI about '+t+' ↗</button>';
  el('ddBody').innerHTML=html;

  el('scrim').classList.add('open'); el('drawer').classList.add('open');
  var spark=series(30,price*0.85,0.02,0.006);
  if(charts.spark)charts.spark.destroy();
  charts.spark=new Chart(el('ddSpark'),{type:'line',data:{labels:spark.map(function(){return ''}),datasets:[{data:spark,borderColor:day>=0?cssVar('--up'):cssVar('--dn'),backgroundColor:day>=0?'rgba(24,158,106,.10)':'rgba(224,65,58,.10)',fill:true,tension:.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
}
function closeStock(){el('scrim').classList.remove('open');el('drawer').classList.remove('open')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeStock()});

/* ============ ASK ============ */
function ask(q){if(typeof sendPrompt==='function'){sendPrompt(q)}else{alert('AI question (wired to LLM/Skill in real app):\n\n"'+q.replace(/<[^>]+>/g,'')+'"')}}
function askFromInput(){var v=el('askInput').value.trim();if(v)ask(v)}
function wireAsk(){var a=el('askInput');if(a)a.addEventListener('keydown',function(e){if(e.key==='Enter')askFromInput()})}

/* ============ DISPATCH ============ */
function renderFund(){
  destroyCharts();
  renderHero();
  if(currentFund==='alpha')renderAlpha();
  else if(currentFund==='sip')renderSip();
  else renderSwing();
}
el('fundSwitch').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;this.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');currentFund=b.dataset.fund;sortState={key:'pnlPct',dir:-1,filter:''};renderFund()});

/* theme */
el('themeBtn').addEventListener('click',function(){var d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');this.innerHTML=d?'&#9790;':'&#9728;';renderFund()});

/* live tick */
setInterval(function(){
  var sets=currentFund==='alpha'?alphaHoldings:currentFund==='sip'?sipHoldings:swingOpen;
  sets.forEach(function(h,i){h.ltp=Math.max(1,h.ltp+Math.sin((Date.now()/1000+i)*0.9)*h.ltp*0.0008)});
  document.querySelectorAll('[data-px]').forEach(function(c){var t=c.getAttribute('data-px');var h=sets.filter(function(x){return x.ticker===t})[0];if(h){c.textContent=usd2(h.ltp)}});
  var ago=el('ago');if(ago)ago.textContent='1s';
},2500);

renderFund();
</script>
</body>
</html>
